<VirtualHost *:80>
    ServerName desk.example.com
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName desk.example.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8710/
    ProxyPassReverse / http://127.0.0.1:8710/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/desk-error.log
    CustomLog ${APACHE_LOG_DIR}/desk-access.log combined

    SSLCertificateFile    /etc/letsencrypt/live/desk.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/desk.example.com/privkey.pem
</VirtualHost>
</IfModule>
