# 프로젝트를 만들 때 빈칸으로 생성되는 기한 항목. 조직에서 쓰는 용어와 순서에 맞게 고쳐 쓴다.
stages:
  - code: bid
    name: 입찰
    items:
      - {code: bid_qna, name: 질의 마감}
      - {code: bid_submit, name: 제안서 제출 마감}
      - {code: bid_present, name: 제안 발표}
      - {code: bid_result, name: 결과 통보}
  - code: contract
    name: 계약·착수
    items:
      - {code: contract_sign, name: 계약 체결}
      - {code: kickoff, name: 착수 보고}
  - code: delivery
    name: 납품
    items:
      - {code: delivery_due, name: 솔루션·시스템 납품 기한}
      - {code: install_done, name: 설치·시험 완료}
  - code: acceptance
    name: 검수
    items:
      - {code: accept_request, name: 검수 요청}
      - {code: accept_due, name: 검수 기한}
      - {code: accept_confirm, name: 검수 확인}
  - code: after
    name: 안정화·인계
    items:
      - {code: stabilize_end, name: 안정화 종료}
      - {code: handover, name: 운영 인계}
      - {code: warranty_end, name: 하자보수 종료}
