<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ APP_TITLE }}</title>
<link rel="stylesheet" href="/static/style.css?v={{ STATIC_VER }}">
</head>
<body class="login-body">
<form method="post" action="/login" class="login-box">
  <h1>{{ APP_TITLE }}</h1>
  {% if not configured %}
    <p class="warn">비밀번호(APP_PASSWORD)가 설정되지 않아 로그인할 수 없습니다.</p>
  {% elif locked %}
    <p class="warn">연속으로 틀려 잠겼습니다. 약 {{ (locked // 60) + 1 }}분 뒤에 다시 시도하십시오.</p>
  {% else %}
    <label for="password">비밀번호</label>
    <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
    {% if error %}<p class="warn">{{ error }}</p>{% endif %}
    <button type="submit">들어가기</button>
  {% endif %}
</form>
</body>
</html>
